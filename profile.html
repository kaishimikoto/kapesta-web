<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="styles/profile-styles.css">
        <title>Profile | Kapesta</title>
    </head>
    <body>
        <header>
            <div class="header-layout">
                <!-- Website Logo / Mobile Menu -->
                <div class="header-brand">
                    <a href="#" class="header-logo">
                        <img src="images/icons/kapesta-logo.svg" alt="Kapesta Home">
                    </a>
                    <button type="button" class="header-menu-toggle" aria-label="Toggle navigation menu" aria-controls="header-navigation" aria-expanded="false" onclick="toggleHeaderMenu()">
                        <img src="images/icons/hamburger-menu-icon.svg" alt="">
                    </button>
                </div>

                <!-- Main Navigation -->
                 <nav class="header-navigation" id="header-navigation" aria-label="Main navigation">
                    <ul class="header-main-links">
                        <li><a href="index.html">Home</a></li>
                        <li><a href="explore.html">Explore</a></li>
                        <li><a href="contact.html">Contact</a></li>
                        <li><a href="about.html">About</a></li>
                        <li><a href="profile.html">Profile</a></li>
                    </ul>

                    <ul class="header-auth-links">
                        <li><a href="login.html" class="header-login-link">Log in</a></li>
                        <li><a href="signup.html" class="header-signup-link">Sign Up</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <!-- ========== PROFILE HEADER ========== -->
        <section class="profile-header">

            <!-- Profile Pic -->
             <div class="profile-photo">
                <img
                    src="pictures/coffee1.jpg"
                    alt="Profile picture"
                    class="profile-pic"
                    id="profile-picture"
                >

                <button
                    type="button"
                    class="edit-button"
                    id="edit-photo-button"
                    aria-label="Edit profile photo"
                >
                    <img src="images/icons/edit.svg" alt="" class="edit-icon">
                </button>

                <input
                    type="file"
                    id="profile-photo-input"
                    accept="image/*"
                    hidden
                >

            </div>

            <!-- User Profile Information -->
            <div class="profile-info">

                <h1>My Profile</h1>

                <p id="profile-username">@username</p>

            </div>
            
        </section>

        <!-- ========== PAGE CONTENTS ========== -->
        <main class="contents">

            <section class="personal-info">

                <header class="personal-info-header">
                    <h2>Account Information</h2>

                    <button type="button" class="edit-profile-button" id="edit-profile-button">
                        <img src="images/icons/edit.svg" alt="Edit" class="icons">
                        Edit Profile
                    </button>
                </header>
                
                <hr>
                
                <div class="info-container">

                    <div class="info-label">
                        <p class="username">Username</p>
                        <p class="email">Email</p>
                    </div>

                    <div class="user-info">
                        <p class="username-value" id="username">username</p>
                        <p class="email-value" id="email">Email</p>
                    </div>

                </div>

            </section>

            <!-- ======= MY FAVORITES ======= -->
            <section class="my-favorites">

                <header class="my-favorites-header">

                    <h2>My Favorites</h2>

                    <a href="my-favorites.html" class="view-all-button">
                        View All
                        <img src="images/icons/right-arrow.svg" alt="" class="icons">
                    </a>

                </header>

                <hr>

                <!-- JavaScript inserts up to 3 favorite cafe cards -->
                <div class="favorite-cafes" id="favorite-cafes"></div>

            </section>


            <!-- ======= MY REVIEWS ======= -->
            <section class="my-reviews">

                <header class="my-reviews-header">

                    <h2>My Reviews</h2>

                    <a href="my-reviews.html" class="view-all-button">
                        View All
                        <img src="images/icons/right-arrow.svg" alt="" class="icons">
                    </a>

                </header>

                <hr>

                <!-- JavaScript inserts up to 3 reviews written by this user here. -->
                <div class="reviews-container" id="my-reviews"></div>

            </section>  

        </main>

        <!-- ========== EDIT PROFILE MODAL ========== -->
        <div class="modal-overlay" id="edit-profile-modal" hidden>

            <div class="edit-profile-modal">

                <div class="modal-header">
                    <h2>Edit Profile</h2>

                    <button type="button" id="close-modal-button"
                        class="close-modal-button" aria-label="Close">
                        &times;
                    </button>
                </div>

                <form id="edit-profile-form">

                    <div class="form-group">
                        <label for="edit-username">Username</label>
                        <input
                            type="text"
                            id="edit-username"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="edit-email">Email</label>
                        <input
                            type="email"
                            id="edit-email"
                            required
                        >
                    </div>

                    <div class="modal-buttons">
                        <button type="button" id="cancel-edit-button">
                            Cancel
                        </button>

                        <button type="submit">
                            Save Changes
                        </button>
                    </div>

                </form>

            </div>

        </div>
        
        <script src="scripts/cafe-data.js"></script>
        <script src="scripts/user-data.js"></script>
        <script src="scripts/navigation.js"></script>
        <script src="scripts/review-display.js"></script>
        <script src="scripts/profile.js"></script>
    </body>
</html>
