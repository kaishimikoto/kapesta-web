<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Kapesta</title>
    <link rel="icon" type="image/png" href="images/kapesta-icon.png">
    <link rel="stylesheet" href="styles/login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>

<body style="background-image: url('images/sign-in-bg.png'); ">

    <!-- ==========================================================================
         BACK TO HOME LINK
         ========================================================================== -->
    <a href="index.html" class="back-home">
        <img src="images/icons/back-arrow.png" alt="" class="back-arrow">
        Back to Home
    </a>

    <!-- ==========================================================================
         LOGIN CARD
         ========================================================================== -->
    <div class="loginform-box">

        <!-- Login form -->
        <form id="login-form" action="#" method="post" novalidate>
            <header>
                <h1>LOGIN FORM</h1>
                <p>Welcome to Kapesta! Login to your account.</p>
            </header>

            <!-- EMAIL -->
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email address" autocomplete="email"
                maxlength="254" pattern="[^\s@]+@[^\s@]+\.[^\s@]{2,}" title="Enter a valid email, e.g. name@example.com"
                autofocus required>
            <span class="error" id="email-error" aria-live="polite"></span>

            <!-- PASSWORD -->
            <label for="pword">Password</label>
            <div class="password-wrapper">
                <input type="password" id="pword" name="pword" placeholder="Enter your password"
                    autocomplete="current-password" minlength="8" maxlength="64" required>

                <button type="button" class="toggle-password" aria-label="Show password" aria-pressed="false">
                    <svg class="icon-eye" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>

                    <svg class="icon-eye-off" viewBox="0 0 24 24" width="20" height="20" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                        <line x1="1" y1="1" x2="23" y2="23" />
                    </svg>
                </button>
            </div>
            <span class="error" id="pword-error" aria-live="polite"></span>

            <input type="submit" value="Login">

            <div class="divider">
                <hr>
                <span>DEMO ACCESS</span>
                <hr>
            </div>

            <button type="button" class="demo-btn" id="demo-btn">Use Demo Account</button>
            
            <p class="signup">New to Kapesta? <a href="signup.html">Create an account</a></p>
        </form>

        <!-- Side image -->
        <div class="login-image">
            <img src="images/kate-laine-qqsicnkuRjE-unsplash.jpg" alt="A cup of coffee on a table">
        </div>

    </div>

   <script src="scripts/user-data.js"></script>
    <script src="scripts/users.js" defer></script>
    <script src="scripts/login.js" defer></script>
    <script src="scripts/auth.js" defer></script>
    <script src="scripts/modal.js" defer></script>
    <script src="scripts/toggle-password.js" defer></script>
</body>

</html>
