<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login | Kapesta</title>
        <link rel="icon" type="image/png" href="images/kapesta-icon.png">
        <link rel="stylesheet" href="styles/login.css">
    
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    </head>
    <body>
    
        <!-- ==========================================================================
             BACK TO HOME LINK
             ========================================================================== -->
        <a href="index.html" class="back-home">
            <img src="images/icons/back-arrow.png" alt="" class="back-arrow">
            Home
        </a>
    
        <!-- ==========================================================================
             LOGIN CARD
             ========================================================================== -->
        <div class="loginform-box">
    
            <!-- Login form -->
            <form action="#" method="post">
                <header>
                    <h1>LOGIN FORM</h1>
                    <p>Welcome to Kapesta! Login to your account.</p>
                </header>
    
                <!-- EMAIL -->
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email address (demo@kapesta.com)" autocomplete="email"
                    maxlength="254" pattern="[^\s@]+@[^\s@]+\.[^\s@]{2,}" title="Enter a valid email, e.g. name@example.com"
                    autofocus required>
                <span class="error" id="email-error" aria-live="polite"></span>
    
                <!-- PASSWORD -->
                <label for="pword">Password</label>
                <input type="password" id="pword" name="pword" placeholder="Enter your password (kapesta123)"
                    autocomplete="current-password" minlength="8" maxlength="64" required>
                <span class="error" id="pword-error" aria-live="polite"></span>
    
                <input type="submit" value="Login">
    
                <div class="divider">
                    <hr>
                    <span>OR</span>
                    <hr>
                </div>
    
                <button type="button" class="google-btn">Continue with Google</button>
    
                <p class="signup">New to Kapesta? <a href="signup.html">Create an account</a></p>
            </form>
    
            <!-- Side image -->
            <div class="login-image">
                <img src="images/kate-laine-qqsicnkuRjE-unsplash.jpg" alt="A cup of coffee on a table">
            </div>
        </div>
        <script src="scripts/login.js" defer></script>
    </body>
</html>
