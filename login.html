<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login | Kapesta</title>
        <link rel="stylesheet" href="login.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="loginform-box">
            <form action="#" method="post">
                <header>
                    <h1>LOGIN FORM</h1>
                    <p>Welcome to Kapesta! Login to your account.</p>
                </header>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email address" autofocus required>

                <label for="pword">Password</label>
                <input type="password" id="pword" name="pword" placeholder="Enter your password" required>

                <input type="submit" value="Login">

                <div class="divider">
                    <hr>
                    <span>OR</span>
                    <hr>
                </div>

                <button type="button" class="google-btn">
                    Continue with Google
                </button>

                <p class="signup"> New to kapesta?
                    <a href="signup.html">Create an account</a>
                </p>
            </form>
            <div class="login-image">
                <img src="images/kate-laine-qqsicnkuRjE-unsplash.jpg" alt="An image of a coffee on a table">
            </div>
        </div>
    </body>
</html>
