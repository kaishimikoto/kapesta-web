<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="styles/global.css">
        <link rel="stylesheet" type="text/css" href="styles/my-reviews.css">
        <title>Kapesta | My Reviews</title>
    </head>
    <body>

        <!-- ==========================================================================
        NAVBAR
        ========================================================================== -->
        <div class="nav-hover-zone"></div>
    
        <header>
            <nav class="navbar">
                <a href="index.html" class="logo-link">
                    <img class="logo" src="images/kapesta-logo.png" alt="Kapesta Logo">
                </a>
    
                <!-- Hamburger button (visible on mobile only) -->
                <button class="nav-toggle" id="navToggle" type="button" aria-label="Toggle navigation menu"
                    aria-expanded="false" aria-controls="navLinks">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
    
                <ul class="nav-links" id="navLinks">
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="explore.html">EXPLORE</a></li>
                    <li><a href="contact.html">CONTACT</a></li>
                    <li><a href="about.html">ABOUT</a></li>
    
                    <li class="profile-menu">
                        <button class="profile-toggle" id="profileToggle" aria-haspopup="true" aria-expanded="false">
                            <span id="profileLabel">PROFILE</span> <span class="caret">&#9662;</span>
                        </button>
    
                        <ul class="profile-dropdown" id="profileDropdown">
                            <li><a href="login.html">Log in</a></li>
                            <li><a href="signup.html">Sign up</a></li>
                        </ul>
                    </li>
                </ul>
            </nav>
        </header>

        <!-- ========== PROFILE HEADER ========== -->
        <section class="profile-page-header">

            <!-- Profile Pic -->
             <div class="profile-photo">
                <img
                    src="pictures/coffee1.jpg"
                    alt="Profile picture"
                    class="profile-pic"
                    id="profile-picture"
                >

                <button
                    type="button"
                    class="edit-button"
                    id="edit-photo-button"
                    aria-label="Edit profile photo"
                >
                    <img src="images/icons/edit.svg" alt="" class="edit-icon">
                </button>

                <input
                    type="file"
                    id="profile-photo-input"
                    accept="image/*"
                    hidden
                >

            </div>

            <!-- User Profile Information -->
            <div class="profile-info">

                <h1>My Profile</h1>

                <p id="profile-username">@username</p>

            </div>
            
        </section>

        <main>

            <div class="all-user-reviews">

                <div class="my-reviews-page-heading">
                    <h2>My Reviews</h2>
                </div>

                <div id="all-my-reviews" class="reviews-container"></div>

            </div>

        </main>

        <!-- ==========================================================================
        FOOTER
        ========================================================================== -->
        <footer>
            <div class="footer-layout">
                <!-- Website Information -->
                <div class="footer-information">
                    <div class="footer-information-logo">
                        <img src="images/icons/kapesta-logo-white.svg" alt="Kapesta" width="120" height="40">
                    </div>
                    <p>Find Your Timpla.</p>

                    <hr />

                    <!-- Social Media -->
                    <nav class="footer-social" aria-label="Social media links">
                        <a href="#" rel="noopener noreferrer">
                            <img src="images/icons/facebook-logo-white.svg" alt="Kapesta on Facebook" width="24" height="24">
                        </a>

                        <a href="#" rel="noopener noreferrer">
                            <img src="images/icons/instagram-logo-white.svg" alt="Kapesta on Instagram" width="24" height="24">
                        </a>

                        <a href="#" rel="noopener noreferrer">
                            <img src="images/icons/twitter-logo-white.svg" alt="Kapesta on Twitter" width="24" height="24">
                        </a>
                    </nav>
                </div>

                <!-- Footer Navigation -->
                <nav class="footer-links" aria-label="Footer navigation">
                    <div class="footer-link-field">
                        <h3 class="footer-nav-title">Platform</h3>
                        <a href="index.html">Home</a>
                        <a href="explore.html">Explore Cafes</a>
                        <a href="about.html">About Us</a>
                        <a href="contact.html">Contact Us</a>
                    </div>

                    <div class="footer-link-field">
                        <h3 class="footer-nav-title">Support</h3>
                        <a href="report.html">Report an Issue</a>
                    </div>

                    <div class="footer-link-field">
                        <h3 class="footer-nav-title">Legal</h3>
                        <a href="privacy.html">Privacy Policy</a>
                        <a href="terms.html">Terms and Conditions</a>
                    </div>
                </nav>
            </div>

            <!-- Footer Bottom -->
            <div class="footer-bottom">
                <hr />
                <small>&copy; 2026 Kapesta. All rights reserved.</small>
            </div>
        </footer>


        
        <script src="scripts/user-data.js"></script>
        <script src="scripts/cafe-data.js"></script>
        <script src="scripts/header.js"></script>
        <script src="scripts/review-display.js"></script>
        <script src="scripts/my-reviews.js"></script>

    </body>
</html>
