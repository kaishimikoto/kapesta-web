<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign Up | Kapesta</title>
        <link rel="stylesheet" href="signup.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="signupform-box">
            <form action="#" method="post">
                <header>
                    <h1>SIGN UP FORM</h1>
                    <p>Welcome to Kapesta! Let's create an account.</p>
                </header>

                <button type="button" class="google-btn">
                    Create an account with Google
                </button>

                <div class="divider">
                    <hr>
                    <span>OR</span>
                    <hr>
                </div>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email address" autofocus required>

                <label for="pword">Password</label>
                <input type="password" id="pword" name="pword" placeholder="Enter your password" required>

                <label for="uname">Username</label>
                <input type="text" id="uname" name="uname" placeholder="Enter your username" required>

                <input type="submit" value="Create an account">

                <label class="terms">
                    <input type="checkbox" name="terms" value="accepted" required>
                    <span>
                        By signing up, you agree to our
                        <a href="terms.html">Terms and conditions</a>
                        and
                        <a href="privacypolicy.html">Privacy policy.</a>
                    </span>
                </label>

                <p class="login">Already have an account? 
                    <a href="login.html">Login</a>
                </p>
            </form>
            <div class="signup-image">
                <img src="images/rizky-subagja-1k7TnX5GAww-unsplash.jpg" alt="An image of a cafe">
            </div>
        </div>
    </body>
</html>
